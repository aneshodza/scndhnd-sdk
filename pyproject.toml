[project]
name = "scndhnd-sdk"
version = "0.1.0"
description = "Python SDKs for Swiss second-hand marketplaces in one install: tutti.ch and anibis.ch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tutti-sdk>=0.1.0", "anibis-sdk>=0.1.0"]

[project.urls]
Repository = "https://github.com/aneshodza/scndhnd-sdk"
Documentation = "https://aneshodza.github.io/scndhnd-sdk/"
Changelog = "https://github.com/aneshodza/scndhnd-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scndhnd_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real marketplaces (deselect with -m 'not live')"]

[tool.ruff]
line-length = 100
